<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าแนะนำตัว – อร</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black:      #0d0d0d;
      --dark:       #161616;
      --card-bg:    #1e1e1e;
      --mint:       #3fffa2;
      --mint-dim:   #2de08a;
      --mint-glow:  rgba(63, 255, 162, 0.18);
      --white:      #f5f5f5;
      --muted:      #a0a0a0;
      --border:     rgba(63, 255, 162, 0.2);
    }

    body {
      background-color: var(--black);
      color: var(--white);
      font-family: 'Inter', 'Sarabun', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    /* ── Animated background dots ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(63, 255, 162, 0.07) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(63, 255, 162, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
    }

    /* ── Profile Card ── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.8rem 2.6rem 2.4rem;
      box-shadow:
        0 0 0 1px rgba(63, 255, 162, 0.08),
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 80px var(--mint-glow);
      animation: fadeUp 0.7s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Avatar ── */
    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.6rem;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mint) 0%, #00c97a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--black);
      box-shadow:
        0 0 0 4px var(--card-bg),
        0 0 0 6px var(--border),
        0 0 30px var(--mint-glow);
      user-select: none;
    }

    /* ── Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(63, 255, 162, 0.1);
      border: 1px solid var(--border);
      color: var(--mint);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 0.9rem;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mint);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── Header text ── */
    .header {
      text-align: center;
      margin-bottom: 2.2rem;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .header h1 span {
      color: var(--mint);
    }

    .header .subtitle {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 300;
    }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin: 1.6rem 0;
    }

    /* ── Info list ── */
    .info-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1.1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      transition: border-color 0.25s, background 0.25s;
    }

    .info-item:hover {
      border-color: var(--border);
      background: rgba(63, 255, 162, 0.05);
    }

    .info-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(63, 255, 162, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .info-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-label {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .info-value {
      font-size: 1rem;
      font-weight: 600;
      color: var(--white);
    }

    /* ── Footer tag ── */
    .footer-tag {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.05em;
    }

    .footer-tag span {
      color: var(--mint);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">

      <!-- Avatar -->
      <div class="avatar-wrap">
        <div class="avatar">อร</div>
      </div>

      <!-- Header -->
      <div class="header">
        <div class="badge">Profile</div>
        <h1>สวัสดี, ฉันชื่อ <span>อร</span> 👋</h1>
        <p class="subtitle">นางสาวศิริกัลยา ขวานา</p>
      </div>

      <hr class="divider">

      <!-- Info items -->
      <div class="info-list">
        <div class="info-item">
          <div class="info-icon">🏷️</div>
          <div class="info-content">
            <span class="info-label">ชื่อเล่น</span>
            <span class="info-value">อร</span>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">👤</div>
          <div class="info-content">
            <span class="info-label">ชื่อ-นามสกุล</span>
            <span class="info-value">นางสาวศิริกัลยา ขวานา</span>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">🎓</div>
          <div class="info-content">
            <span class="info-label">รหัสนักศึกษา</span>
            <span class="info-value">68043494109</span>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">💻</div>
          <div class="info-content">
            <span class="info-label">สาขา</span>
            <span class="info-value">คอมพิวเตอร์ธุรกิจ</span>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">🏪</div>
          <div class="info-content">
            <span class="info-label">ร้านโครงงาน</span>
            <span class="info-value">ร้านคอมพิวเตอร์</span>
          </div>
        </div>

        <hr class="divider">

        <div class="info-item">
          <div class="info-icon">📸</div>
          <div class="info-content">
            <span class="info-label">Instagram</span>
            <span class="info-value">@7xrnn_</span>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">📧</div>
          <div class="info-content">
            <span class="info-label">Gmail</span>
            <span class="info-value">sirikallaya81239@gmail.com</span>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <p class="footer-tag">made with <span>♥</span> &amp; mint</p>

    </div>
  </div>
</body>
</html>
